<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Admin Serentti - Gestão de Estoque</title>
    <style>
        body { font-family: 'Jost', sans-serif; padding: 40px; background: #f4f4f4; }
        
        /* Estilo da Tela de Login */
        #tela-login {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
        }
        #tela-login input { margin-bottom: 10px; width: 250px; }

        /* Esconde o painel por padrão */
        #painel-admin { display: none; }

        .container { max-width: 700px; background: white; padding: 30px; border-radius: 12px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; letter-spacing: 3px; font-weight: 300; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        
        .item-estoque { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px; 
            border-bottom: 1px solid #f9f9f9; 
        }
        .item-estoque:last-child { border-bottom: none; }
        
        .produto-info-wrap {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .thumb-admin {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            background: #f0f0f0;
            border: 1px solid #eee;
        }
        
        .id-texto {
            font-weight: bold;
            font-size: 1rem;
            color: #333;
        }

        .controles {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input { 
            width: 80px; 
            padding: 10px; 
            text-align: center; 
            border: 1px solid #ddd; 
            border-radius: 6px;
            font-size: 1rem;
        }
        
        button { 
            background: #1a1a1a; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            cursor: pointer; 
            border-radius: 6px; 
            transition: 0.3s;
            font-weight: 500;
        }
        button:hover { background: #444; transform: translateY(-1px); }
        
        .loading { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="tela-login">
        <h2 style="color: white; border: none;">ACESSO RESTRITO</h2>
        <input type="password" id="senha-input" placeholder="Digite a senha mestre">
        <button onclick="verificarSenha()">Entrar</button>
        <p id="erro-senha" style="color: #ff4d4d; margin-top: 10px; display: none;">Senha incorreta!</p>
    </div>

    <!-- PAINEL PROTEGIDO -->
    <div id="painel-admin">
        <div class="container">
            <h2>SERENTTI - ESTOQUE</h2>
            <div id="lista-estoque">
                <p class="loading">Carregando catálogo e estoque...</p>
            </div>
        </div>
    </div>

<script>
    const API_URL = "https://serentti-backend.onrender.com";
    const SENHA_MESTRE = "SUA_SENHA_AQUI"; // <-- COLOQUE SUA SENHA AQUI

    function verificarSenha() {
        const senhaDigitada = document.getElementById('senha-input').value;
        if (senhaDigitada === SENHA_MESTRE) {
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('painel-admin').style.display = 'block';
            carregarEstoque(); // Só carrega os dados após acertar a senha
        } else {
            document.getElementById('erro-senha').style.display = 'block';
        }
    }

    // Permitir apertar "Enter" para entrar
    document.getElementById('senha-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') verificarSenha();
    });

    const idsProdutos = [
        "col-fem-1", "col-fem-2", "col-fem-3", "col-fem-4", "col-fem-5",
        "pul-fem-1", "pul-fem-2", "pul-fem-3", "pul-fem-4", "pul-fem-5",
        "col-masc-1", "col-masc-2", "col-masc-3", "col-masc-4",
        "pul-masc-1", "pul-masc-2", "pul-masc-3"
    ];

    function getCaminhoFoto(id) {
        if (id.startsWith('col-fem')) return `Images/ColarFeminino/${id}.png`;
        if (id.startsWith('pul-fem')) {
            return id === 'pul-fem-1' ? `Images/PulseiraFeminino/${id}.jpeg` : `Images/PulseiraFeminino/${id}.png`;
        }
        if (id.startsWith('col-masc')) return `Images/ColarMasculino/${id}.png`;
        if (id.startsWith('pul-masc')) {
            return id === 'pul-masc-2' ? `Images/PulseiraMasculino/${id}.jpeg` : `Images/PulseiraMasculino/${id}.png`;
        }
        return '';
    }

    async function carregarEstoque() {
        try {
            const res = await fetch(`${API_URL}/consultar-estoque`);
            const estoqueReal = await res.json();
            
            const lista = document.getElementById('lista-estoque');
            lista.innerHTML = "";

            idsProdutos.forEach(id => {
                const qtd = estoqueReal[id] !== undefined ? estoqueReal[id] : 0;
                const fotoPath = getCaminhoFoto(id);
                
                lista.innerHTML += `
                    <div class="item-estoque">
                        <div class="produto-info-wrap">
                            <img src="${fotoPath}" class="thumb-admin" onerror="this.src='https://via.placeholder.com/100?text=Sem+Foto'">
                            <span class="id-texto">${id}</span>
                        </div>
                        <div class="controles">
                            <input type="number" id="input-${id}" value="${qtd}">
                            <button onclick="salvar('${id}')">Salvar</button>
                        </div>
                    </div>
                `;
            });
        } catch (err) {
            document.getElementById('lista-estoque').innerHTML = "<p style='color:red;'>Erro ao carregar dados do servidor.</p>";
        }
    }

    async function salvar(id) {
        const input = document.getElementById(`input-${id}`);
        const novaQuantidade = input.value;

        try {
            const response = await fetch(`${API_URL}/atualizar-estoque`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: id, quantidade: novaQuantidade })
            });

            if (response.ok) {
                alert(`✅ Estoque de ${id} atualizado!`);
            } else {
                alert("❌ Erro ao salvar no banco.");
            }
        } catch (error) {
            console.error("Erro:", error);
            alert("❌ Sem conexão com o servidor.");
        }
    }
</script>
</body>
</html>
