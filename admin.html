<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Admin Serentti - Gestão de Estoque</title>
    <style>
        body { font-family: 'Jost', sans-serif; padding: 40px; background: #f4f4f4; }
        
        #tela-login {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
        }
        #tela-login input { 
            margin-bottom: 10px; 
            width: 250px; 
            padding: 12px; 
            border-radius: 6px; 
            border: none;
            text-align: center;
        }

        #painel-admin { display: none; }

        .container { max-width: 850px; background: white; padding: 30px; border-radius: 12px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; letter-spacing: 3px; font-weight: 300; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        
        .item-estoque { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px; 
            border-bottom: 1px solid #f9f9f9; 
            gap: 10px;
        }
        .item-estoque:last-child { border-bottom: none; }
        
        .produto-info-wrap {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            pointer-events: none; /* Evita que o clique no texto interfira nos inputs */
        }
        
        .thumb-admin, .id-texto, .controles {
            pointer-events: auto; /* Reativa o clique para os elementos internos */
        }

        .thumb-admin {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            background: #f0f0f0;
            border: 1px solid #eee;
        }
        
        .id-texto {
            font-weight: bold;
            font-size: 0.9rem;
            color: #333;
            min-width: 90px;
        }

        .controles {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Estilo dos Inputs */
        .input-qtd, .input-codigo { 
            padding: 10px; 
            text-align: center; 
            border: 1px solid #ddd; 
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .input-qtd { width: 60px; }
        .input-codigo { 
            width: 120px; 
            background: #ffffff !important; /* Força fundo branco para indicar edição */
            cursor: text;
        }
        
        button { 
            background: #1a1a1a; 
            color: white; 
            border: none; 
            padding: 10px 15px; 
            cursor: pointer; 
            border-radius: 6px; 
            transition: 0.3s;
            font-weight: 500;
        }
        button:hover { background: #444; transform: translateY(-1px); }
        
        .loading { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>

    <div id="tela-login">
        <h2 style="color: white; border: none;">SERENTTI ADMIN</h2>
        <input type="password" id="senha-input" placeholder="Senha de Acesso">
        <button id="btn-entrar" onclick="verificarSenha()">Entrar</button>
        <p id="erro-senha" style="color: #ff4d4d; margin-top: 10px; display: none;">Senha incorreta ou erro de conexão!</p>
    </div>

    <div id="painel-admin">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>ESTOQUE</h2>
                <button onclick="logout()" style="padding: 5px 10px; font-size: 12px; background: #cc0000;">Sair</button>
            </div>
            <div id="lista-estoque">
                <p class="loading">Carregando catálogo...</p>
            </div>
        </div>
    </div>

<script>
    const API_URL = "https://serentti-backend.onrender.com";
    let senhaValidada = ""; 

    async function verificarSenha() {
        const input = document.getElementById('senha-input');
        const erro = document.getElementById('erro-senha');
        const btn = document.getElementById('btn-entrar');

        btn.innerText = "Verificando...";
        erro.style.display = 'none';

        try {
            const res = await fetch(`${API_URL}/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ senha: input.value })
            });

            if (res.ok) {
                senhaValidada = input.value;
                document.getElementById('tela-login').style.display = 'none';
                document.getElementById('painel-admin').style.display = 'block';
                carregarEstoque();
            } else {
                erro.style.display = 'block';
                input.value = "";
            }
        } catch (err) {
            alert("Erro ao conectar com o servidor.");
        } finally {
            btn.innerText = "Entrar";
        }
    }

    function logout() {
        location.reload();
    }

    document.getElementById('senha-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') verificarSenha();
    });

    const idsProdutos = [
        "col-fem-1", "col-fem-2", "col-fem-3", "col-fem-4", "col-fem-5",
        "pul-fem-1", "pul-fem-2", "pul-fem-3", "pul-fem-4", "pul-fem-5",
        "col-masc-1", "col-masc-2", "col-masc-3", "col-masc-4",
        "pul-masc-1", "pul-masc-2", "pul-masc-3"
    ];

    function getCaminhoFoto(id) {
        if (id.startsWith('col-fem')) return `Images/ColarFeminino/${id}.png`;
        if (id.startsWith('pul-fem')) {
            return id === 'pul-fem-1' ? `Images/PulseiraFeminino/${id}.jpeg` : `Images/PulseiraFeminino/${id}.png`;
        }
        if (id.startsWith('col-masc')) return `Images/ColarMasculino/${id}.png`;
        if (id.startsWith('pul-masc')) {
            return id === 'pul-masc-2' ? `Images/PulseiraMasculino/${id}.jpeg` : `Images/PulseiraMasculino/${id}.png`;
        }
        return '';
    }

    async function carregarEstoque() {
        try {
            const res = await fetch(`${API_URL}/consultar-estoque`);
            const estoqueReal = await res.json();
            
            const lista = document.getElementById('lista-estoque');
            lista.innerHTML = "";

            idsProdutos.forEach(id => {
                const dados = estoqueReal[id] || { qtd: 0, codigo: "" };
                const qtd = typeof dados === 'object' ? dados.qtd : dados;
                const codProd = dados.codigo || "";
                
                const fotoPath = getCaminhoFoto(id);
                
                lista.innerHTML += `
                    <div class="item-estoque">
                        <div class="produto-info-wrap">
                            <img src="${fotoPath}" class="thumb-admin" onerror="this.src='https://via.placeholder.com/100?text=Sem+Foto'">
                            <span class="id-texto">${id}</span>
                        </div>
                        <div class="controles">
                            <input type="text" class="input-codigo" id="cod-${id}" placeholder="Cód. Ref" value="${codProd}">
                            <input type="number" class="input-qtd" id="input-${id}" value="${qtd}">
                            <button onclick="salvar('${id}', this)">Salvar</button>
                        </div>
                    </div>
                `;
            });
        } catch (err) {
            document.getElementById('lista-estoque').innerHTML = "<p style='color:red;'>Erro ao carregar dados.</p>";
        }
    }

    async function salvar(id, btn) {
        const inputQtd = document.getElementById(`input-${id}`);
        const inputCod = document.getElementById(`cod-${id}`);
        
        const novaQuantidade = inputQtd.value;
        const novoCodigo = inputCod.value; 
        
        const originalText = btn.innerText;

        btn.innerText = "...";
        btn.disabled = true;

        try {
            const response = await fetch(`${API_URL}/atualizar-estoque`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    id: id, 
                    quantidade: novaQuantidade,
                    codigo_produto: novoCodigo, 
                    senha: senhaValidada 
                })
            });

            if (response.ok) {
                btn.style.background = "#28a745";
                setTimeout(() => { 
                    btn.style.background = "#1a1a1a"; 
                    btn.innerText = originalText;
                    btn.disabled = false;
                }, 1000);
            } else {
                alert("❌ Erro ao salvar: Verifique o servidor ou a sessão.");
                btn.innerText = originalText;
                btn.disabled = false;
            }
        } catch (error) {
            alert("❌ Erro de conexão.");
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
