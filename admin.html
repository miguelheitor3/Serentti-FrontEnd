<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serentti | Painel de Estoque</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark: #1a1a1a;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; color: var(--dark); text-transform: uppercase; letter-spacing: 2px; }
        
        .admin-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .product-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .product-info { display: flex; align-items: center; gap: 20px; }
        
        .product-info img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .stock-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="number"] {
            width: 60px;
            padding: 8px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: 0.3s;
        }

        .btn-update { background-color: var(--dark); color: white; }
        .btn-update:hover { background-color: var(--gold); }

        .status-msg {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9em;
            color: green;
        }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>Controle de Estoque</h1>
    <div id="status" class="status-msg"></div>
    <div id="inventory-list">
        <!-- Os produtos serão carregados aqui via JS -->
    </div>
</div>

<script>
    // URL do seu backend no Render
    const API_URL = "https://serentti-backend.onrender.com";

    // Lista simulada baseada nos seus produtos atuais[cite: 1]
    const produtos = [
        { id: 'col-fem-1', nome: 'Colar Veneziano', img: 'Images/ColarFeminino/col-fem-1.png', estoque: 10 },
        { id: 'col-fem-2', nome: 'Colar Elo Português', img: 'Images/ColarFeminino/col-fem-2.png', estoque: 5 },
        { id: 'brinco-1', nome: 'Brinco Argola Ouro', img: 'Images/Brincos/brinco-1.png', estoque: 8 }
    ];

    function renderInventory() {
        const list = document.getElementById('inventory-list');
        list.innerHTML = '';

        produtos.forEach(p => {
            list.innerHTML += `
                <div class="product-row">
                    <div class="product-info">
                        <img src="${p.img}" alt="${p.nome}">
                        <div>
                            <strong>${p.nome}</strong><br>
                            <small>ID: ${p.id}</small>
                        </div>
                    </div>
                    <div class="stock-control">
                        <input type="number" id="input-${p.id}" value="${p.estoque}">
                        <button class="btn-update" onclick="saveStock('${p.id}')">Atualizar</button>
                    </div>
                </div>
            `;
        });
    }

    async function saveStock(productId) {
        const newValue = document.getElementById(`input-${productId}`).value;
        const statusDiv = document.getElementById('status');

        try {
            const response = await fetch(`${API_URL}/atualizar-estoque`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: productId, quantidade: newValue })
            });

            if (response.ok) {
                statusDiv.innerText = `Produto ${productId} atualizado com sucesso!`;
                setTimeout(() => statusDiv.innerText = '', 3000);
            }
        } catch (error) {
            console.error("Erro ao atualizar:", error);
            statusDiv.style.color = 'red';
            statusDiv.innerText = "Erro ao conectar com o servidor.";
        }
    }

    renderInventory();
</script>

</body>
</html>
