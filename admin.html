<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Admin Serentti - Gestão de Estoque</title>
    <style>
        body { font-family: 'Jost', sans-serif; padding: 40px; background: #f4f4f4; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; margin: auto; }
        .item-estoque { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        input { width: 60px; padding: 5px; text-align: center; }
        button { background: #1a1a1a; color: white; border: none; padding: 8px 15px; cursor: pointer; }
        .status { color: green; font-size: 0.8rem; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Gestão de Estoque - Serentti</h2>
        <div id="lista-estoque">
            <!-- Os produtos aparecerão aqui via JS -->
        </div>
    </div>

    <script>
        const API_URL = "https://serentti-backend.onrender.com";

        // 1. Busca o estoque real do servidor ao abrir a página
        async function carregarEstoque() {
            const res = await fetch(`${API_URL}/consultar-estoque`);
            const estoque = await res.json();
            
            const lista = document.getElementById('lista-estoque');
            lista.innerHTML = "";

            for (const id in estoque) {
                lista.innerHTML += `
                    <div class="item-estoque">
                        <span><strong>${id}</strong></span>
                        <div>
                            <input type="number" id="input-${id}" value="${estoque[id]}">
                            <button onclick="salvar('${id}')">Salvar</button>
                        </div>
                    </div>
                `;
            }
        }

        // 2. Envia a atualização para o servidor
        async function salvar(id) {
            const qtd = document.getElementById(`input-${id}`).value;
            const res = await fetch(`${API_URL}/atualizar-estoque`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id, quantidade: qtd })
            });

            if (res.ok) alert(`Produto ${id} atualizado para ${qtd} unidades.`);
        }

        carregarEstoque();
    </script>
</body>
</html>
